# Villode cursor — macOS-style pointer + shake-to-find (sprite size, not screen zoom)
# Theme lives in ~/.local/share/icons (macOS + macOS-hypr)

env = XCURSOR_THEME,macOS
env = HYPRCURSOR_THEME,macOS-hypr
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

cursor {
    enable_hyprcursor = true
    no_hardware_cursors = false
    # IMPORTANT: zoom_factor zooms the *monitor view*, not the pointer.
    # Leave at 1. Shake-to-find uses setcursor size instead.
    zoom_factor = 1.0
    zoom_rigid = false
    inactive_timeout = 0
    hide_on_key_press = false
}

exec-once = hyprctl keyword cursor:zoom_factor 1
exec-once = hyprctl setcursor macOS-hypr 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'macOS'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
# Shake mouse → enlarge pointer sprite (macOS "shake to find")
exec-once = villode-cursor-shake

# Manual find-cursor pulse (~1.2s, pointer size only)
bind = SUPER SHIFT, C, exec, villode-cursor-shake --pulse
